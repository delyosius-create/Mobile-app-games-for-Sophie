name: Build Android APK

# Builds a real, installable .apk from the web game using Capacitor.
# Runs automatically on pushes, and can be triggered by hand from the
# Actions tab (which also publishes the APK as a downloadable Release).

on:
  push:
    branches: ["**"]
    paths:
      - "www/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk UnicornMatch.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnicornMatch-APK
          path: UnicornMatch.apk
          if-no-files-found: error

      - name: Publish APK as a Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Unicorn Match APK (build ${{ github.run_number }})
          body: |
            📱 Download **UnicornMatch.apk** below, copy it to an Android phone,
            and tap to install (you may need to allow "Install from unknown sources").
          files: UnicornMatch.apk
